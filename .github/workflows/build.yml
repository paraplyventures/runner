name: build

# Builds the image on every push to main and weekly (for security updates),
# and publishes it to ghcr.io/<owner>/runner as :<runner version> and
# :<runner version>-<date>. Pull requests only build.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tags
        id: tags
        run: |
          version=$(sed -n 's/^ARG RUNNER_VERSION=//p' Dockerfile)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/runner"
          {
            echo "tags<<EOT"
            echo "$image:$version"
            echo "$image:$version-$(date -u +%Y%m%d)"
            echo "$image:latest"
            echo "EOT"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
